groups:
  - name: newsscan
    rules:
      - alert: HealthCheckFailing
        expr: probe_success{job="health-checks"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A health check is failing"
          description: "{{ $labels.instance }} has not answered for 1 minute."

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus can't reach a target"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unreachable for 2 minutes."

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is not answering"
          description: "The database has been down for 1 minute. Scans can't be saved."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is not answering"
          description: "The queue has been down for 1 minute. New scans can't be queued."

      - alert: DiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The disk is almost full"
          description: "The disk is {{ $value | printf \"%.0f\" }}% full."

      - alert: ContainerNumbersStale
        expr: |
          (time() - node_textfile_mtime_seconds{file=~".*docker_containers.prom"} > 120)
          or (absent(node_textfile_mtime_seconds{file=~".*docker_containers.prom"}) * 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Per-container numbers have stopped updating"
          description: "The docker stats timer may have stopped. Check: systemctl --user list-timers newsscan-docker-stats.timer"

      - alert: ScansFailing
        expr: sum(increase(newsscan_scans_finished_total{outcome="failed"}[15m])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Several scans failed"
          description: "{{ $value | printf \"%.0f\" }} scans failed in the last 15 minutes."

      - alert: ServerErrors
        expr: sum(increase(newsscan_http_requests_total{status=~"5.."}[5m])) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The API keeps returning server errors"
          description: "The API returned {{ $value | printf \"%.0f\" }} server errors in the last 5 minutes."

  - name: monitoring-itself
    rules:
      - alert: PrometheusCantReachAlertmanager
        expr: prometheus_notifications_alertmanagers_discovered < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alerts have nowhere to go"
          description: "Prometheus can't find Alertmanager, so no alert can reach your phone."

      - alert: PrometheusCantSendAlerts
        expr: increase(prometheus_notifications_errors_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Prometheus failed to hand alerts to Alertmanager"
          description: "Some alerts were not delivered to Alertmanager in the last 10 minutes."

      - alert: AlertmanagerCantSendMessages
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager failed to send a message to your phone"
          description: "Messages to ntfy have failed in the last 10 minutes. Check the internet and the ntfy address."

      - alert: PrometheusRulesBroken
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "An alert rule can't be evaluated"
          description: "At least one alert rule failed to run in the last 10 minutes, so it may not fire when it should."

      - alert: LogsNotArriving
        expr: sum(rate(loki_distributor_lines_received_total[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No logs are reaching Loki"
          description: "Loki has received no log lines for 10 minutes. Check the Alloy container."
