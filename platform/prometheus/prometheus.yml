global:
  scrape_interval: 15s   # check each target every 15 seconds
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml   # the alert rules

scrape_configs:
  - job_name: newsscan-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: newsscan-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]

  # The computer itself: CPU, memory, disk.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The database and the queue, from the inside.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Asks the Blackbox Exporter to visit each address, like a user would.
  - job_name: health-checks
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/healthz
          - http://api:8000/readyz
          - http://worker:9101/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
