global:
  scrape_interval: 15s   # check each target every 15 seconds
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml   # alert rules go here later

scrape_configs:
  - job_name: newsscan-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: newsscan-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
