auth_enabled: false   # one user, and the port is not published

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h   # keep 7 days of logs
  ingestion_rate_mb: 4
  max_streams_per_user: 1000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true   # without this, old logs are never deleted
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
