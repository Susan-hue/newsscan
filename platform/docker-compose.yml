# The monitoring stack. Start the app first, then this:
#   cd app && docker compose up -d
#   cd platform && docker compose up -d
# Don't run `down -v` on either one: it deletes saved data.

name: newsscan-platform

services:
  prometheus:
    image: prom/prometheus:v3.5.0   # a fixed version, so it doesn't change on its own
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # keep 15 days of data...
      - --storage.tsdb.retention.size=1GB   # ...or 1 GB, whichever comes first
    ports:
      - "127.0.0.1:9090:9090"   # only reachable from this computer
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - app
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  grafana:
    image: grafana/grafana:12.2.0   # a fixed version, so it doesn't change on its own
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in platform/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"   # only reachable from this computer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - app
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  app:
    name: newsscan_default   # the app's network, created by the main compose file
    external: true

volumes:
  prometheus-data:
