# The monitoring stack. Start the app first, then this:
#   cd app && docker compose up -d
#   cd platform && docker compose up -d
# Don't run `down -v` on either one: it deletes saved data.

name: newsscan-platform

services:
  prometheus:
    image: prom/prometheus:v3.5.0   # a fixed version, so it doesn't change on its own
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # keep 15 days of data...
      - --storage.tsdb.retention.size=1GB   # ...or 1 GB, whichever comes first
    ports:
      - "127.0.0.1:9090:9090"   # only reachable from this computer
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - app
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  app:
    name: newsscan_default   # the app's network, created by the main compose file
    external: true

volumes:
  prometheus-data:
